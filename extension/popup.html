
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Job Intelligence Scanner</h1>

  <label>
    Backend URL
    <input id="backendUrl" value="http://127.0.0.1:8002">
  </label>

  <label>
    Max jobs to scan
    <input id="maxJobs" type="number" min="1" max="100" value="20">
  </label>

  <div class="buttons">
    <button id="start">Start scan</button>
    <button id="stop" class="secondary">Stop</button>
  </div>

  <button id="recordApplication" class="wide">I applied — record selected job</button>

  <button id="dashboard" class="wide">Open dashboard</button>

  <div id="status">Ready</div>
  <div class="progress"><div id="bar"></div></div>
  <div id="summary"></div>

  <script src="popup.js"></script>
</body>
</html>
