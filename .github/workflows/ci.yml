name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked runtime databases and backups
        run: |
          if git ls-files --error-unmatch data/jobs.db >/dev/null 2>&1; then
            echo "data/jobs.db must never be tracked"
            exit 1
          fi
          if git ls-files --error-unmatch backend/jobs.db.migrated >/dev/null 2>&1; then
            echo "backend/jobs.db.migrated must never be tracked"
            exit 1
          fi
          if git ls-files | grep -Ei '(^|/)backups?/.*\.(db|sqlite|sqlite3)(-(wal|shm))?$|(^|/)[^/]*backup[^/]*\.(db|sqlite|sqlite3)(-(wal|shm))?$'; then
            echo "Database backup artifacts must never be tracked"
            exit 1
          fi

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    env:
      JOBS_DB_PATH: ${{ runner.temp }}/quality.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check backend/app tests
      - name: Black check
        run: python -m black --check backend/app tests
      - name: MyPy configured scope
        run: python -m mypy backend/app tests
      - name: Python syntax checks
        run: python -m compileall -q backend/app backend/main.py tests migrations
      - name: JavaScript syntax checks
        run: find backend/static extension -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  test-suite:
    name: Test suite
    runs-on: ubuntu-latest
    env:
      JOBS_DB_PATH: ${{ runner.temp }}/pytest.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Pytest
        run: python -m pytest

  migration-safety:
    name: Migration safety
    runs-on: ubuntu-latest
    env:
      JOBS_DB_PATH: ${{ runner.temp }}/migration.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Upgrade, downgrade, and re-upgrade temporary database
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade 20260712_0003
          python -m alembic upgrade head
          python -m alembic current
      - name: Alembic regression tests
        run: python -m pytest tests/test_migrations.py tests/test_migration_readiness.py

  temporary-database-smoke:
    name: Temporary database smoke
    runs-on: ubuntu-latest
    env:
      JOBS_DB_PATH: ${{ runner.temp }}/smoke.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Health, API, dashboard, and path smoke tests
        run: >-
          python -m pytest
          tests/test_application.py
          tests/test_database_path_integration.py
          tests/test_database_paths.py
      - name: Confirm protected databases were not created
        run: |
          test ! -e data/jobs.db
          test ! -e backend/jobs.db.migrated
